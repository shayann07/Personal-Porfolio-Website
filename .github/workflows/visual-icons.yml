name: Visual icon check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: visual-icons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install Python dependencies
        run: pip install --no-cache-dir playwright pillow numpy

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Unit tests (icon motion specs)
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 2
          done
          echo "preview server did not start" && exit 1

      - name: Visual icon check
        env:
          BASE_URL: http://127.0.0.1:8080
          VISUAL_OUT: ${{ github.workspace }}/visual-output
        run: python3 scripts/visual-icon-check.py

      - name: Visual scroll-position check
        env:
          BASE_URL: http://127.0.0.1:8080
          VISUAL_OUT: ${{ github.workspace }}/visual-output/scroll
        run: python3 scripts/visual-scroll-check.py

      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-icon-output
          path: visual-output
          if-no-files-found: ignore
          retention-days: 7
